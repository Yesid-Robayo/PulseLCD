[package]
name = "pulselcd"
description = "Tu PC en una pantalla pequeña: estadísticas en vivo, temas y un panel que se cuida solo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "PulseLCD"
path = "src/main.rs"

[dependencies]
pulse-shared.workspace = true
pulse-panel.workspace = true
pulse-render.workspace = true
pulse-sensors.workspace = true
serde.workspace = true
serde_json.workspace = true
tao = { version = "0.37.2", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57.1", default-features = false, features = ["os-webview"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.12"
